# Deploy the docs/ demo site to GitHub Pages.
#
# The demo bundles the renderer straight out of src/, so it always shows the
# code on main rather than a stale copy of a published build.
#
# One-time setup: Settings > Pages > Build and deployment > Source = GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
